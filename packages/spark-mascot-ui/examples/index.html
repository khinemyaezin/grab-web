<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spark Mascot UI</title>
    <script type="module" src="../src/index.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7fb;
        color: #232635;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      button,
      select,
      input {
        font: inherit;
      }

      .app {
        display: grid;
        grid-template-columns: minmax(260px, 340px) minmax(0, 1fr);
        min-height: 100vh;
      }

      .controls {
        display: flex;
        flex-direction: column;
        gap: 18px;
        border-right: 1px solid #dedfed;
        background: #ffffff;
        padding: 28px;
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.15;
      }

      .muted {
        margin: 0;
        color: #6a6f85;
        font-size: 14px;
        line-height: 1.5;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      label {
        color: #42475c;
        font-size: 13px;
        font-weight: 700;
      }

      select,
      input[type="text"] {
        width: 100%;
        height: 38px;
        border: 1px solid #d5d7e5;
        border-radius: 8px;
        background: #ffffff;
        color: #252a3f;
        padding: 0 10px;
      }

      .toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid #e2e4ef;
        border-radius: 8px;
        padding: 11px 12px;
      }

      .segmented {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .segmented button {
        height: 38px;
        border: 1px solid #d5d7e5;
        border-radius: 8px;
        background: #ffffff;
        color: #42475c;
        cursor: pointer;
      }

      .segmented button[aria-pressed="true"] {
        border-color: #13b8a6;
        background: rgba(19, 184, 166, .08);
        color: #0f766e;
        font-weight: 700;
      }

      .stage {
        display: grid;
        grid-template-rows: minmax(360px, 52vh) auto;
        gap: 24px;
        padding: 32px;
      }

      .preview {
        display: grid;
        min-height: 360px;
        place-items: center;
        border: 1px solid #e0e2ee;
        border-radius: 12px;
        background:
          radial-gradient(circle at 50% 42%, rgba(19, 184, 166, .12), transparent 34%),
          linear-gradient(180deg, #ffffff, #f2f4fb);
      }

      .preview spark-mascot,
      .preview pikachu-mascot {
        filter: drop-shadow(0 24px 32px rgba(31, 41, 55, .12));
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }

      .tile {
        display: grid;
        min-height: 190px;
        align-content: center;
        justify-items: center;
        gap: 10px;
        border: 1px solid #e0e2ee;
        border-radius: 10px;
        background: #ffffff;
        padding: 16px;
      }

      .tile strong {
        font-size: 14px;
      }

      code {
        display: block;
        overflow-x: auto;
        border-radius: 8px;
        background: #222733;
        color: #f4f7ff;
        padding: 14px;
        font-size: 12px;
        line-height: 1.6;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 820px) {
        .app {
          grid-template-columns: 1fr;
        }

        .controls {
          border-right: 0;
          border-bottom: 1px solid #dedfed;
        }

        .stage {
          grid-template-rows: auto auto;
          padding: 20px;
        }

        .gallery {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="controls" aria-label="Mascot controls">
        <div class="brand">
          <h1>Spark Mascot UI</h1>
          <p class="muted">Reusable animated SVG mascots with pose, emotion, and gesture support.</p>
        </div>

        <div class="field">
          <label>Character</label>
          <div class="segmented" role="group" aria-label="Character">
            <button id="character-spark" type="button" aria-pressed="true">Spark</button>
            <button id="character-pikachu" type="button" aria-pressed="false">Pikachu</button>
          </div>
        </div>

        <div class="field">
          <label for="pose">Pose</label>
          <select id="pose">
            <option value="coffee">Coffee</option>
            <option value="idle">Idle</option>
            <option value="celebrate">Celebrate</option>
            <option value="support">Support</option>
          </select>
        </div>

        <div class="field hidden" id="emotion-field">
          <label for="emotion">Emotion</label>
          <select id="emotion">
            <option value="happy">Happy</option>
            <option value="sad">Sad</option>
            <option value="neutral">Neutral</option>
          </select>
        </div>

        <div class="field">
          <label for="palette">Palette</label>
          <select id="palette">
            <option value="citrus">Citrus</option>
            <option value="berry">Berry</option>
            <option value="mint">Mint</option>
          </select>
        </div>

        <div class="field">
          <label for="accent">Accent color</label>
          <input id="accent" type="text" value="#13b8a6" />
        </div>

        <label class="toggle">
          <span>Animated</span>
          <input id="animated" type="checkbox" checked />
        </label>

        <code id="snippet">&lt;spark-mascot pose="coffee" accessory="coffee" animated size="xl"&gt;&lt;/spark-mascot&gt;</code>
      </section>

      <section class="stage" aria-label="Mascot preview">
        <div class="preview">
          <spark-mascot id="preview-spark" pose="coffee" accessory="coffee" size="xl" animated interactive></spark-mascot>
          <pikachu-mascot id="preview-pikachu" class="hidden" pose="coffee" emotion="happy" accessory="coffee" size="xl" animated interactive></pikachu-mascot>
        </div>

        <div class="gallery" id="gallery-spark">
          <div class="tile">
            <spark-mascot preset="coffee" size="md" animated></spark-mascot>
            <strong>Coffee</strong>
          </div>
          <div class="tile">
            <spark-mascot preset="idle" size="md" animated></spark-mascot>
            <strong>Storefront</strong>
          </div>
          <div class="tile">
            <spark-mascot preset="support" size="md" palette="berry" animated></spark-mascot>
            <strong>Support</strong>
          </div>
          <div class="tile">
            <spark-mascot preset="celebrate" size="md" palette="mint" animated></spark-mascot>
            <strong>Success</strong>
          </div>
        </div>

        <div class="gallery hidden" id="gallery-pikachu">
          <div class="tile">
            <pikachu-mascot preset="coffee" size="md" animated></pikachu-mascot>
            <strong>Happy Coffee</strong>
          </div>
          <div class="tile">
            <pikachu-mascot preset="sadCoffee" size="md" animated></pikachu-mascot>
            <strong>Sad Coffee</strong>
          </div>
          <div class="tile">
            <pikachu-mascot preset="happy" size="md" palette="sunset" animated></pikachu-mascot>
            <strong>Happy</strong>
          </div>
          <div class="tile">
            <pikachu-mascot preset="sad" size="md" palette="pastel" animated></pikachu-mascot>
            <strong>Sad</strong>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      const previewSpark = document.querySelector("#preview-spark");
      const previewPikachu = document.querySelector("#preview-pikachu");
      const pose = document.querySelector("#pose");
      const emotion = document.querySelector("#emotion");
      const palette = document.querySelector("#palette");
      const accent = document.querySelector("#accent");
      const animated = document.querySelector("#animated");
      const snippet = document.querySelector("#snippet");
      const emotionField = document.querySelector("#emotion-field");
      const characterSpark = document.querySelector("#character-spark");
      const characterPikachu = document.querySelector("#character-pikachu");
      const gallerySpark = document.querySelector("#gallery-spark");
      const galleryPikachu = document.querySelector("#gallery-pikachu");

      const SPARK_POSES = ["coffee", "idle", "celebrate", "support"];
      const PIKACHU_POSES = ["coffee", "idle", "celebrate", "wave"];
      const SPARK_PALETTES = ["citrus", "berry", "mint"];
      const PIKACHU_PALETTES = ["classic", "sunset", "pastel"];

      let activeCharacter = "spark";

      function accessoryForPose(value, character) {
        if (value === "coffee") return "coffee";
        if (character === "spark" && value === "support") return "headset";
        if (value === "celebrate") return "sparkles";
        return "none";
      }

      function setCharacter(character) {
        activeCharacter = character;
        const isPikachu = character === "pikachu";

        characterSpark.setAttribute("aria-pressed", String(!isPikachu));
        characterPikachu.setAttribute("aria-pressed", String(isPikachu));
        previewSpark.classList.toggle("hidden", isPikachu);
        previewPikachu.classList.toggle("hidden", !isPikachu);
        gallerySpark.classList.toggle("hidden", isPikachu);
        galleryPikachu.classList.toggle("hidden", !isPikachu);
        emotionField.classList.toggle("hidden", !isPikachu);

        const poses = isPikachu ? PIKACHU_POSES : SPARK_POSES;
        const palettes = isPikachu ? PIKACHU_PALETTES : SPARK_PALETTES;
        const currentPose = pose.value;

        pose.innerHTML = poses.map((value) => {
          const label = value.charAt(0).toUpperCase() + value.slice(1);
          return `<option value="${value}">${label}</option>`;
        }).join("");

        if (!poses.includes(currentPose)) {
          pose.value = "coffee";
        } else {
          pose.value = currentPose;
        }

        palette.innerHTML = palettes.map((value) => {
          const label = value.charAt(0).toUpperCase() + value.slice(1);
          return `<option value="${value}">${label}</option>`;
        }).join("");

        palette.value = isPikachu ? "classic" : "citrus";
        accent.value = isPikachu ? "#e8352b" : "#13b8a6";
        render();
      }

      function render() {
        const poseValue = pose.value;
        const accessory = accessoryForPose(poseValue, activeCharacter);
        const preview = activeCharacter === "pikachu" ? previewPikachu : previewSpark;
        const tagName = activeCharacter === "pikachu" ? "pikachu-mascot" : "spark-mascot";

        preview.setAttribute("pose", poseValue);
        preview.setAttribute("accessory", accessory);
        preview.setAttribute("palette", palette.value);
        preview.setAttribute("accent", accent.value);

        if (activeCharacter === "pikachu") {
          preview.setAttribute("emotion", emotion.value);
        } else {
          preview.removeAttribute("emotion");
        }

        if (animated.checked) {
          preview.setAttribute("animated", "");
        } else {
          preview.setAttribute("animated", "false");
        }

        const emotionAttr = activeCharacter === "pikachu" ? ` emotion="${emotion.value}"` : "";
        snippet.textContent = `<${tagName} pose="${poseValue}" accessory="${accessory}" palette="${palette.value}" accent="${accent.value}"${emotionAttr} ${animated.checked ? "animated " : ""}size="xl"></${tagName}>`;
      }

      characterSpark.addEventListener("click", () => setCharacter("spark"));
      characterPikachu.addEventListener("click", () => setCharacter("pikachu"));

      for (const control of [pose, emotion, palette, accent, animated]) {
        control.addEventListener("input", render);
      }

      render();
    </script>
  </body>
</html>
