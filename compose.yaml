name: grab-web

services:
  grab-seller-auth:
    image: grab-seller-auth:local
    build:
      context: .
      dockerfile: grab-seller-auth/Dockerfile
      secrets:
        - npmrc
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AUTH_PORT:-3003}:80"
    networks:
      - seller-network
    restart: unless-stopped

  grab-seller-account:
    image: grab-seller-account:local
    build:
      context: .
      dockerfile: grab-seller-account/Dockerfile
      secrets:
        - npmrc
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${ONBOARDING_PORT:-3004}:80"
    networks:
      - seller-network
    restart: unless-stopped

  grab-seller-product:
    image: grab-seller-product:local
    build:
      context: .
      dockerfile: grab-seller-product/Dockerfile
      secrets:
        - npmrc
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PRODUCT_PORT:-3001}:80"
    networks:
      - seller-network
    restart: unless-stopped

  grab-seller-inventory:
    image: grab-seller-inventory:local
    build:
      context: .
      dockerfile: grab-seller-inventory/Dockerfile
      secrets:
        - npmrc
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${INVENTORY_PORT:-3002}:80"
    networks:
      - seller-network
    restart: unless-stopped

  grab-seller-pricing:
    image: grab-seller-pricing:local
    build:
      context: .
      dockerfile: grab-seller-pricing/Dockerfile
      secrets:
        - npmrc
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PRICING_PORT:-3005}:80"
    networks:
      - seller-network
    restart: unless-stopped

  grab-seller:
    image: grab-seller:local
    build:
      context: .
      dockerfile: grab-seller/Dockerfile
      secrets:
        - npmrc
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SELLER_PORT:-3000}:80"
    networks:
      - seller-network
    depends_on:
      grab-seller-auth:
        condition: service_started
      grab-seller-account:
        condition: service_started
      grab-seller-product:
        condition: service_started
      grab-seller-inventory:
        condition: service_started
      grab-seller-pricing:
        condition: service_started
    restart: unless-stopped

networks:
  seller-network:
    name: "${DOCKER_NETWORK:-grab-dev-network}"
    external: true

secrets:
  npmrc:
    file: ~/.npmrc
