name: grab-web

x-app-common: &app-common
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - seller-network
  restart: unless-stopped
  environment:
    API_UPSTREAM: ${API_UPSTREAM:-host.docker.internal:8080}

x-app-build: &app-build
  context: .
  dockerfile: docker/app.Dockerfile
  secrets:
    - npmrc

services:
  grab-seller-auth:
    <<: *app-common
    image: grab-seller-auth:local
    build:
      <<: *app-build
      args:
        APP_NAME: seller-auth
        APP_DIR: apps/grab-seller-auth
    ports:
      - "${AUTH_PORT:-3003}:80"

  grab-seller-account:
    <<: *app-common
    image: grab-seller-account:local
    build:
      <<: *app-build
      args:
        APP_NAME: seller-account
        APP_DIR: apps/grab-seller-account
    ports:
      - "${ONBOARDING_PORT:-3004}:80"

  grab-seller-product:
    <<: *app-common
    image: grab-seller-product:local
    build:
      <<: *app-build
      args:
        APP_NAME: grab-seller-product
        APP_DIR: apps/grab-seller-product
    ports:
      - "${PRODUCT_PORT:-3001}:80"

  grab-seller-inventory:
    <<: *app-common
    image: grab-seller-inventory:local
    build:
      <<: *app-build
      args:
        APP_NAME: grab-seller-inventory
        APP_DIR: apps/grab-seller-inventory
    ports:
      - "${INVENTORY_PORT:-3002}:80"

  grab-seller-pricing:
    <<: *app-common
    image: grab-seller-pricing:local
    build:
      <<: *app-build
      args:
        APP_NAME: grab-seller-pricing
        APP_DIR: apps/grab-seller-pricing
    ports:
      - "${PRICING_PORT:-3005}:80"

  grab-seller:
    <<: *app-common
    image: grab-seller:local
    build:
      <<: *app-build
      args:
        APP_NAME: grab-seller
        APP_DIR: apps/grab-seller
        NGINX_CONF: gateway/nginx.conf
        HEALTHCHECK_PATH: /
    ports:
      - "${SELLER_PORT:-3000}:80"
    depends_on:
      grab-seller-auth:
        condition: service_started
      grab-seller-account:
        condition: service_started
      grab-seller-product:
        condition: service_started
      grab-seller-inventory:
        condition: service_started
      grab-seller-pricing:
        condition: service_started

networks:
  seller-network:
    name: "${DOCKER_NETWORK:-grab-dev-network}"
    external: true

secrets:
  npmrc:
    file: ~/.npmrc
